# نشر wtn على خادم واحد.
#
#   cd /opt/wtn && docker compose -f deploy/docker-compose.yml up -d --build
#
# ثلاث خدمات: الموقع، وموجّهٌ يصنع شهادة HTTPS وحده، وبوت واتساب.
# القاعدة **خارج الخادم** (Neon) عمداً: ضاعت البيانات مرّةً حين كانت رهينة
# المضيف، فلا تعود رهينة هذا الخادم أيضاً.

name: wtn

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    expose: ["8000"]
    # يخرج إلى الشبكة (مزوّدون + قاعدة Neon) ويستقبل من caddy وحده
    networks: [wtn]

  # يُبنى ولا يُسحب جاهزاً: الشهادة الشاملة للمتاجر تحتاج وحدة Cloudflare
  # التي لا توجد في الصورة الرسمية (caddy.Dockerfile يشرح لماذا).
  caddy:
    build:
      context: .
      dockerfile: caddy.Dockerfile
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # الشهادات — لا تُحذف وإلا أُعيد إصدارها كل مرّة
      - caddy_config:/config
    # المفتاح من `deploy/.env` نفسه — لا ملفٍّ جديد: `env_file` لملفٍّ ناقص
    # يُفشل `up` كلَّه، فيصير نسيانُ المفتاح إسقاطاً للموقع لا تعطيلاً لميزة.
    # و`:-` تجعل غيابَه فراغاً لا خطأ.
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    depends_on: [web]
    networks: [wtn]

  # بوت واتساب: كان على جهاز المالك فينام معه. هنا يعمل دائماً.
  # `network_mode` عادي كي يصل إلى الموقع بالاسم الداخلي `web`.
  bot:
    image: node:22-slim
    restart: unless-stopped
    working_dir: /app
    volumes: ["../bot:/app"]
    command: sh -c "npm ci --omit=dev && npm start"
    env_file: [.env.bot]
    depends_on: [web]
    networks: [wtn]

volumes:
  caddy_data:
  caddy_config:

networks:
  wtn:
