# Render Blueprint — نشر مجاني بخدمة واحدة (Django يقدّم الـ API + الواجهة).
# الاستخدام: Render Dashboard → New → Blueprint → اختر هذا المستودع → Apply.
#
# ⚠️ قاعدة البيانات لم تعد على Render. كانت `wtn-db` بالخطة المجانية، وهذه
# تُحذف نهائياً بعد ٣٠ يوماً من إنشائها — وقد حُذفت فعلاً في 2026-08-12 فتوقّف
# الموقع (فشل `migrate` ← `set -e` في start.sh ← لا خادم). القاعدة الآن على
# مزوّد خارجي دائم (Neon)، ورابطها في `DATABASE_URL` أدناه.

services:
  - type: web
    name: wtn
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: "*"
      # السرّ المشترك مع بوت واتساب. يولّده Render مرّةً، وتنسخه من لوحته إلى
      # ملف bot/.env على الجهاز الذي يشغّل البوت. بدونه تبقى الواجهة الداخلية
      # مغلقة تماماً (503) — وهو السلوك المقصود.
      - key: INTERNAL_API_KEY
        generateValue: true
      # رابط قاعدة Neon الكامل. `sync: false` تعني: يُلصق يدوياً مرّةً واحدة من
      # لوحة Render (Environment)، ولا يُكتب في المستودع لأنه يحوي كلمة السرّ.
      # صيغته: postgresql://user:pass@ep-xxx.region.aws.neon.tech/wtn_db?sslmode=require
      - key: DATABASE_URL
        sync: false
